services:

  postgres:
    image: postgres:16-alpine
    container_name: sara_postgres
    environment:
      POSTGRES_USER: sara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sara_db
      TZ: America/Bogota
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sara -d sara_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - sara_net
    deploy:
      resources:
        limits:
          memory: 512m

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: sara_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks:
      - sara_net
    deploy:
      resources:
        limits:
          memory: 512m

  ollama:
    image: ollama/ollama:latest
    container_name: sara_ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - sara_net
    deploy:
      resources:
        limits:
          memory: 3g

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sara_backend:latest
    container_name: sara_backend
    env_file: .env.prod
    environment:
      TZ: America/Bogota
      DATABASE_URL: postgresql+asyncpg://sara:${POSTGRES_PASSWORD}@postgres:5432/sara_db
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      OLLAMA_HOST: http://ollama:11434
      FIREBASE_CREDENTIALS_PATH: /secrets/firebase-credentials.json
      GOOGLE_CREDENTIALS_PATH: /secrets/google-credentials.json
      WHISPER_MODEL: small
    volumes:
      - ./secrets:/secrets:ro
      - whisper_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - sara_net
    deploy:
      resources:
        limits:
          memory: 4g

  web:
    build:
      context: ./clients/web
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://sara_backend:8000
    image: sara_web:latest
    container_name: sara_web
    ports:
      - "3000:3000"
    env_file: .env.prod
    environment:
      BACKEND_URL: http://sara_backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sara_net
    deploy:
      resources:
        limits:
          memory: 512m

  nginx:
    image: nginx:alpine
    container_name: sara_nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sara_net
    deploy:
      resources:
        limits:
          memory: 128m

networks:
  sara_net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  whisper_cache:

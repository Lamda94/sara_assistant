services:
  # PostgreSQL reutiliza el contenedor existente "tharot-pg" en puerto 5432
  # Para levantarlo manualmente: docker start tharot-pg

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sara_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
